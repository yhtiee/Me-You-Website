<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title, description, icons and share tags are added at build time from src/seo.ts. -->
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('meyou-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body data-page="delete-account">
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui">
        Me&amp;u works best with JavaScript turned on. Read our
        <a href="/privacy/">privacy policy</a>, <a href="/terms/">terms</a> or <a href="/support/">support</a> pages.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
