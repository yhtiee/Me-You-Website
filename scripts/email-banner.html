<!doctype html>
<!--
  The banner at the top of every transactional email (1120×320, shown at
  560×160), rendered to public/images/email-banner.png by
  scripts/generate-assets.mjs. The app's Edge Functions link to it at
  https://www.meandyou.tech/images/email-banner.png, so keep the path stable.
  Edit this file, then run `npm run assets`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 800;
        src: url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 600;
        src: url('../node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1120px;
        height: 320px;
        overflow: hidden;
        position: relative;
        font-family: 'Manrope', sans-serif;
        color: #221a2b;
        background:
          radial-gradient(55% 90% at 100% 0%, rgba(110, 90, 200, 0.2), transparent 60%),
          radial-gradient(45% 80% at 0% 100%, rgba(240, 84, 111, 0.16), transparent 60%),
          linear-gradient(180deg, #fcedf2, #fbf8fa);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        box-shadow: 0 8px 22px rgba(34, 26, 43, 0.12);
      }
      .brand b {
        font-weight: inherit;
      }
      .brand span {
        color: #f0546f;
      }
      p {
        margin-top: 18px;
        font-size: 26px;
        font-weight: 600;
        color: #6b6275;
      }
      .art {
        position: absolute;
        right: 56px;
        top: 50%;
        transform: translateY(-50%);
        width: 400px;
        filter: drop-shadow(0 16px 24px rgba(116, 52, 120, 0.16));
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../public/images/icon.png" alt="" /><b>Me<span>&amp;</span>u</b></div>
      <p>Two people, one place.</p>
    </div>
    <img class="art" src="../public/images/connect.png" alt="" />
  </body>
</html>
