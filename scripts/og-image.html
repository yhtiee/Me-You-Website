<!doctype html>
<!--
  The social preview (1200×630), rendered to public/og-image.png by
  scripts/generate-assets.mjs. Edit this file, then run `npm run assets`.
  Fonts and images are loaded relative to the project, so it only renders
  correctly through the script.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 800;
        src: url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 600;
        src: url('../node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 700;
        src: url('../node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        font-family: 'Manrope', sans-serif;
        color: #221a2b;
        background:
          radial-gradient(60% 80% at 100% 0%, rgba(110, 90, 200, 0.22), transparent 60%),
          radial-gradient(50% 70% at 0% 100%, rgba(240, 84, 111, 0.18), transparent 60%),
          linear-gradient(180deg, #fcedf2, #fbf8fa);
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 70px;
        width: 640px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(34, 26, 43, 0.12);
      }
      .brand b {
        font-weight: inherit;
      }
      .brand span {
        color: #f0546f;
      }
      h1 {
        margin-top: 44px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 70px;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(135deg, #d63c58, #6e5ac8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 28px;
        font-size: 26px;
        font-weight: 600;
        color: #6b6275;
      }
      .pill {
        position: absolute;
        left: 80px;
        bottom: 62px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(180deg, #f0546f, #d63c58);
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        box-shadow: 0 12px 28px rgba(240, 84, 111, 0.3);
      }
      .art {
        position: absolute;
        right: 40px;
        top: 110px;
        width: 470px;
        filter: drop-shadow(0 20px 30px rgba(116, 52, 120, 0.18));
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../public/images/icon.png" alt="" /><b>Me<span>&amp;</span>u</b></div>
      <h1>You check in.<br />They check in.<br /><em>The streak grows.</em></h1>
      <p>The everyday app for couples.</p>
    </div>
    <div class="pill">For iPhone &amp; Android</div>
    <img class="art" src="../public/images/settle.png" alt="" />
  </body>
</html>
